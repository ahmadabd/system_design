groups:
  - name: backend_alerts
    rules:
      - alert: HighCPULoad
        expr: rate(process_cpu_seconds_total[1m]) > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage for service {{ $labels.job }} on instance {{ $labels.instance }} is above 80% for more than 1 minute."

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "Service {{ $labels.job }} on instance {{ $labels.instance }} has been down for more than 1 minute."

      # --- Security Alerts ---

      - alert: PotentialScanningActivity
        expr: sum(rate(http_request_duration_seconds_count{status=~"404"}[5m])) by (instance) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 404 rate on {{ $labels.instance }}"
          description: "Detected more than 5 404 errors per second. This may indicate a vulnerability scan."

      - alert: UnauthorizedAccessSpike
        expr: sum(rate(http_request_duration_seconds_count{status=~"401|403"}[5m])) by (instance) > 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Spike in Unauthorized Access on {{ $labels.instance }}"
          description: "High rate of 401/403 errors detected, possible brute force attempt."

      - alert: HighRequestRateAnomalous
        expr: sum(rate(http_request_duration_seconds_count[5m])) by (instance) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Abnormal Traffic Volume on {{ $labels.instance }}"
          description: "Traffic volume is over 100 req/s, possible DDoS or scraping."

      # --- Resilience Alerts ---

      - alert: DatabaseCircuitBreakerOpen
        expr: circuit_breaker_state{name="postgres-database"} == 1
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Database Circuit Breaker OPEN on {{ $labels.instance }}"
          description: "The database connection circuit breaker for service {{ $labels.instance }} has tripped to OPEN due to consecutive failures. Downstream writes will fail-fast."

      - alert: OutboxBacklogSpike
        expr: outbox_backlog_size > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox Backlog Accumulation on {{ $labels.service_name }}"
          description: "Outbox backlog size for {{ $labels.service_name }} has exceeded 50 pending events for 2 minutes. Integration events may be delayed."

      - alert: DeadLetterQueueRouted
        expr: sum(rate(messaging_dlq_routed_total[5m])) by (original_topic) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Events routing to Dead Letter Queue for {{ $labels.original_topic }}"
          description: "Consumer processing has failed repeatedly, causing events to route to DLQ topic '{{ $labels.original_topic }}.deadletter'."

      - alert: AICircuitBreakerTripped
        expr: circuit_breaker_state{name=~"qdrant-breaker|openrouter-breaker|order-client-breaker"} == 1
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "AI Circuit Breaker OPEN: {{ $labels.name }}"
          description: "Circuit breaker {{ $labels.name }} has tripped to OPEN due to consecutive failures. AI Support will fast-fail or degrade gracefully."

      - alert: MCPHighDegradedRate
        expr: sum(rate(mcp_circuit_breaker_trips_total[2m])) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High MCP Circuit Breaker Degradation Rate on {{ $labels.instance }}"
          description: "AI Agent tool calls are experiencing circuit breaker trips and degraded responses due to backend outages."

      - alert: MCPServiceDown
        expr: up{job="fastapi", instance=~"mcp-service:8008.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MCP Service Down"
          description: "mcp-service:8008 has been unreachable for more than 1 minute. Autonomous AI agents cannot connect."

      - alert: DiscoveryServiceDown
        expr: up{job="fastapi", instance=~"discovery-service:8009.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Product Discovery & Bundle Service Down"
          description: "discovery-service:8009 has been unreachable for more than 1 minute. Semantic search and bundle building are offline."

      - alert: DiscoveryHighLatency
        expr: histogram_quantile(0.95, sum by (le, node_name) (rate(discovery_node_duration_seconds_bucket[2m]))) > 2.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High Latency in Discovery LangGraph Node: {{ $labels.node_name }}"
          description: "LangGraph node {{ $labels.node_name }} has P95 latency exceeding 2.5s."

      - alert: CopilotServiceDown
        expr: up{job="fastapi", instance=~"merchant-copilot-service:8010.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Merchant Copilot Service Down"
          description: "merchant-copilot-service:8010 has been unreachable for more than 1 minute. ClickHouse Text-to-SQL is offline."

      - alert: CopilotSQLCorrectionSpike
        expr: sum(rate(merchant_copilot_sql_self_corrections_total[2m])) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Spike in Merchant Copilot SQL Self-Correction Loops"
          description: "LLM Text-to-SQL generation is producing invalid queries and triggering frequent self-correction retries."

      - alert: CopilotHighLatency
        expr: histogram_quantile(0.95, sum by (le, node_name) (rate(merchant_copilot_node_duration_seconds_bucket[2m]))) > 3.0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High Latency in Copilot LangGraph Node: {{ $labels.node_name }}"
          description: "LangGraph node {{ $labels.node_name }} has P95 latency exceeding 3.0s."

      - alert: GraphRAGServiceDown
        expr: up{job="fastapi", instance=~"knowledge-graph-rag-service:8011.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Knowledge Graph RAG Service Down"
          description: "knowledge-graph-rag-service:8011 has been unreachable for more than 1 minute. Graph-augmented root-cause analysis is offline."

      - alert: GraphRAGHighLatency
        expr: histogram_quantile(0.95, sum by (le, node_name) (rate(graphrag_node_duration_seconds_bucket[2m]))) > 2.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High Latency in GraphRAG LangGraph Node: {{ $labels.node_name }}"
          description: "GraphRAG LangGraph node {{ $labels.node_name }} has P95 latency exceeding 2.5s."


