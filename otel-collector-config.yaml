extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Limit memory usage to prevent OOM under high load
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Batch spans/logs before exporting for efficiency
  batch:
    send_batch_size: 512
    timeout: 2s

  # Promote service.name → service_name resource label (needed by both Jaeger and Loki)
  resource:
    attributes:
      - key: service_name
        from_attribute: service.name
        action: upsert
      - key: environment
        from_attribute: environment
        action: insert

exporters:
  # Send traces to Jaeger via OTLP HTTP
  otlphttp/jaeger:
    endpoint: "http://jaeger:4318"
    tls:
      insecure: true

  # Expose metrics for Prometheus scraping
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    metric_expiration: 180s

  # Push logs to Loki via OTLP HTTP (Loki >=2.9 native OTLP endpoint)
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn   # Suppress noisy collector internal logs

  pipelines:
    # Distributed traces → Jaeger (all services: user, product, order, payment, support, etc.)
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/jaeger]

    # Prometheus metrics → Prometheus scrape endpoint
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

    # Structured logs → Loki (all services, with service_name label for filtering)
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]

