http:
  routers:
    user-router:
      rule: "PathPrefix(`/users`)"
      entryPoints:
        - web
      middlewares:
        - "rate-limit"
        - "load-shedding"
        - "strip-users"
      service: user-service

    product-router:
      rule: "PathPrefix(`/products`)"
      entryPoints:
        - web
      middlewares:
        - "rate-limit"
        - "load-shedding"
        - "strip-products"
      service: product-service

    order-router:
      rule: "PathPrefix(`/orders`)"
      entryPoints:
        - web
      middlewares:
        - "rate-limit"
        - "load-shedding"
        - "strip-orders"
      service: order-service

    payment-router:
      rule: "PathPrefix(`/payments`)"
      entryPoints:
        - web
      middlewares:
        - "rate-limit"
        - "load-shedding"
        - "strip-payments"
      service: payment-service

    reporting-router:
      rule: "PathPrefix(`/reporting`)"
      entryPoints:
        - web
      middlewares:
        - "rate-limit"
        - "load-shedding"
        - "strip-reporting"
      service: reporting-service

    webhook-router:
      rule: "PathPrefix(`/webhooks`)"
      entryPoints:
        - web
      middlewares:
        - "rate-limit"
        - "load-shedding"
        - "strip-webhooks"
      service: webhook-service

    support-router:
      rule: "PathPrefix(`/support`)"
      entryPoints:
        - web
      middlewares:
        - "rate-limit"
        - "load-shedding"
        - "strip-support"
      service: support-service

    mcp-router:
      rule: "PathPrefix(`/mcp`)"
      entryPoints:
        - web
      middlewares:
        - "rate-limit"
        - "load-shedding"
        - "strip-mcp"
      service: mcp-service

    discovery-router:
      rule: "PathPrefix(`/discovery`)"
      middlewares:
        - "load-shedding"
        - "rate-limit"
        - "strip-discovery"
      service: discovery-service

    copilot-router:
      rule: "PathPrefix(`/copilot`)"
      middlewares:
        - "load-shedding"
        - "rate-limit"
        - "strip-copilot"
      service: merchant-copilot-service

  middlewares:
    load-shedding:
      inFlightReq:
        amount: 50
        sourceCriterion:
          ipStrategy:
            depth: 0

    rate-limit:
      rateLimit:
        average: 30
        burst: 50
        sourceCriterion:
          ipStrategy:
            depth: 0

    strip-users:
      stripPrefix:
        prefixes:
          - "/users"

    strip-products:
      stripPrefix:
        prefixes:
          - "/products"

    strip-orders:
      stripPrefix:
        prefixes:
          - "/orders"

    strip-payments:
      stripPrefix:
        prefixes:
          - "/payments"

    strip-reporting:
      stripPrefix:
        prefixes:
          - "/reporting"

    strip-webhooks:
      stripPrefix:
        prefixes:
          - "/webhooks"

    strip-support:
      stripPrefix:
        prefixes:
          - "/support"

    strip-mcp:
      stripPrefix:
        prefixes:
          - "/mcp"

    strip-discovery:
      stripPrefix:
        prefixes:
          - "/discovery"

    strip-copilot:
      stripPrefix:
        prefixes:
          - "/copilot"


  services:
    user-service:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 2s
          timeout: 1s
        servers:
          - url: "http://user-service:8001"

    product-service:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 2s
          timeout: 1s
        servers:
          - url: "http://product-service:8002"

    order-service:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 2s
          timeout: 1s
        servers:
          - url: "http://order-service:8003"

    payment-service:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 2s
          timeout: 1s
        servers:
          - url: "http://payment-service:8004"

    reporting-service:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 2s
          timeout: 1s
        servers:
          - url: "http://reporting-service:8005"

    webhook-service:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 2s
          timeout: 1s
        servers:
          - url: "http://webhook-service:8006"

    support-service:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 2s
          timeout: 1s
        servers:
          - url: "http://support-service:8007"

    mcp-service:
      loadBalancer:
        servers:
          - url: "http://mcp-service:8008"

    discovery-service:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 2s
          timeout: 1s
        servers:
          - url: "http://discovery-service:8009"

    merchant-copilot-service:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 2s
          timeout: 1s
        servers:
          - url: "http://merchant-copilot-service:8010"