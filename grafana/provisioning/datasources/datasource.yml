apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: Prometheus
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: Loki
    editable: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: regex
          matcherRegex: '"trace_id":\s*"([a-f0-9]+)"'
          url: "$${__value.raw}"
          datasourceUid: Jaeger
          urlDisplayLabel: "View Trace"
        - name: TraceID_Plain
          matcherType: regex
          matcherRegex: 'trace_id=([a-f0-9]+)'
          url: "$${__value.raw}"
          datasourceUid: Jaeger
          urlDisplayLabel: "View Trace"

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    uid: Jaeger
    editable: true
